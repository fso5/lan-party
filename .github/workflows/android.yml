# Builds an installable Android APK in the cloud.
#
# This exists so the game can reach a phone with no laptop anywhere in the loop:
# the APK is attached to a release, and you download and install it directly
# from the phone's browser.
#
# It builds the debug variant deliberately. A release APK needs a signing key,
# and an unsigned release APK will not install at all -- Android refuses it. The
# debug variant is signed with the standard debug keystore, which is enough to
# sideload. Play Store signing is a later problem.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'packages/proto/**'
      - '.github/workflows/android.yml'
      # A lockfile-only change still alters what gets built, and npm ci is
      # exact-by-design, so it has to retrigger the build.
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The app embeds the built game, which is built from the core.
      - run: npm run build --workspace @tanks/core
      - run: node packages/app/scripts/embed-game.mjs

      # Expo generates the native android/ project from app.json. It is not
      # committed, so that config stays the single source of truth rather than
      # drifting from generated Gradle files nobody remembers editing.
      - name: Generate the native project
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install

      # Restrict the APK to arm64.
      #
      # Two mechanisms, and only the second actually does it.
      # reactNativeArchitectures controls what gets *compiled from source*, so
      # setting it alone still shipped all four ABIs: React Native's and Expo's
      # native libraries arrive prebuilt inside AAR dependencies, and nothing
      # recompiles them. Filtering those needs ndk.abiFilters, which applies at
      # packaging time regardless of where a .so came from.
      - name: Build for arm64 only
        working-directory: packages/app/android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          grep '^reactNativeArchitectures' gradle.properties
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          if 'abiFilters' in s:
              raise SystemExit('abiFilters already present -- check the template changed')
          # Insert into defaultConfig, which every Expo-generated app module has.
          s2, n = re.subn(
              r'(defaultConfig\s*\{)',
              r"\1\n        ndk { abiFilters 'arm64-v8a' }",
              s, count=1)
          if n != 1:
              raise SystemExit('could not find defaultConfig in app/build.gradle')
          p.write_text(s2)
          print('injected abiFilters into defaultConfig')
          PY

      # Release, not debug. The debug variant came out at 123 MB: unstripped
      # native libraries, debug symbols and an unminified bundle.
      #
      # Needs no signing key. The Expo Android template points the release build
      # type at the checked-in debug keystore, so the output is signed with APK
      # Signature Scheme v2 -- enough to sideload. A real key is only needed for
      # Play Store distribution.
      - name: Build the APK
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon

      # Ship the single-file web build next to the APK. It is 105 KB against the
      # APK's 55 MB, which matters when the whole point is getting this onto a
      # phone over a link that may not last. Generated here rather than tracked
      # in git, where it silently drifted 209 lines behind the real build.
      - name: Build the standalone single-file version
        run: |
          node packages/proto/build.mjs
          # Name the file what the download should be called. gh's "path#label"
          # syntax sets a display label but leaves the asset -- and its download
          # URL -- named after the file on disk.
          cp packages/proto/dist/tanks-proto.html tanks.html

      # A STABLE filename. Naming it after the commit meant every link went dead
      # the moment anything else was pushed: this workflow recreates the "latest"
      # release each run, which deletes the previous asset. Anyone holding a link
      # got a 404 and reasonably assumed their connection was at fault. The
      # commit is recorded in the release notes instead, where staleness is
      # harmless.
      - name: Collect the APK
        id: apk
        run: |
          SRC=$(find packages/app/android -name '*.apk' | head -1)
          echo "Found APK at $SRC ($(du -h "$SRC" | cut -f1))"
          mkdir -p out
          cp "$SRC" out/tanks.apk
          echo "path=out/tanks.apk" >> "$GITHUB_OUTPUT"
          echo "name=tanks.apk" >> "$GITHUB_OUTPUT"
          unzip -l out/tanks.apk | grep -oE 'lib/[^/]+/' | sort -u | head

      - uses: actions/upload-artifact@v4
        with:
          name: tanks-apk
          path: ${{ steps.apk.outputs.path }}

      # A release gives a plain download link a phone browser can follow.
      # Workflow artifacts are zipped and need a logged-in session to fetch,
      # which is a miserable thing to do on a phone.
      - name: Publish to the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            "${{ steps.apk.outputs.path }}" \
            "tanks.html" \
            --title "Latest build" \
            --notes "$(cat <<NOTES
          Built from \`${GITHUB_SHA::7}\`.

          | File | Size | What it is |
          |---|---|---|
          | [\`tanks.apk\`](https://github.com/fso5/tanks-mobile/releases/download/latest/tanks.apk) | $(du -h "${{ steps.apk.outputs.path }}" | cut -f1) | Android app, arm64. Tap to install. |
          | \`tanks.html\` | $(du -h tanks.html | cut -f1) | Single file, opens in any browser. Works offline. |

          Both run with no internet. Tap **2P** for two players on one phone.
          NOTES
          )" \
            --latest
