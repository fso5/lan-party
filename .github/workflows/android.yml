# Builds an installable Android APK in the cloud.
#
# This exists so the game can reach a phone with no laptop anywhere in the loop:
# the APK is attached to a release, and you download and install it directly
# from the phone's browser.
#
# It builds the debug variant deliberately. A release APK needs a signing key,
# and an unsigned release APK will not install at all -- Android refuses it. The
# debug variant is signed with the standard debug keystore, which is enough to
# sideload. Play Store signing is a later problem.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'packages/proto/**'
      - '.github/workflows/android.yml'
      # A lockfile-only change still alters what gets built, and npm ci is
      # exact-by-design, so it has to retrigger the build.
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A bound, because core's tests no longer run under `--test-force-exit`.
    # That flag was added with the WebSocket server, whose test left a socket
    # listening so node would not exit on its own -- but it also cut the last
    # test file off mid-run, and node reported the shortened run as a clean
    # pass: `fail 0`, `cancelled 0`, `skipped 0`, exit 0. Three identical local
    # runs gave 178, 172 and 178 tests, so a green tick meant "some tests
    # passed". Without the flag it is 178 every time. If a future test does
    # leak a handle the run will hang instead, and hanging for 30 minutes is a
    # far better failure than silently skipping six tests for ever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The app resolves @tanks/core through Metro to its TypeScript source, so
      # no dist build is needed for the APK. Build it anyway: the core tests run
      # against dist, and a compile error should fail here rather than surface
      # later as a broken published package.
      - run: npm run build --workspace @tanks/core

      - name: Test both workspaces
        run: npm test --workspaces --if-present

      # Expo generates the native android/ project from app.json. It is not
      # committed, so that config stays the single source of truth rather than
      # drifting from generated Gradle files nobody remembers editing.
      - name: Embed the game page the host phone serves
        working-directory: packages/app
        run: npm run embed-page

      - name: Generate the native project
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install

      # Restrict the APK to arm64.
      #
      # Two mechanisms, and only the second actually does it.
      # reactNativeArchitectures controls what gets *compiled from source*, so
      # setting it alone still shipped all four ABIs: React Native's and Expo's
      # native libraries arrive prebuilt inside AAR dependencies, and nothing
      # recompiles them. Filtering those needs ndk.abiFilters, which applies at
      # packaging time regardless of where a .so came from.
      - name: Build for arm64 only
        working-directory: packages/app/android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          grep '^reactNativeArchitectures' gradle.properties
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          if 'abiFilters' in s:
              raise SystemExit('abiFilters already present -- check the template changed')
          # Insert into defaultConfig, which every Expo-generated app module has.
          s2, n = re.subn(
              r'(defaultConfig\s*\{)',
              r"\1\n        ndk { abiFilters 'arm64-v8a' }",
              s, count=1)
          if n != 1:
              raise SystemExit('could not find defaultConfig in app/build.gradle')
          p.write_text(s2)
          print('injected abiFilters into defaultConfig')
          PY

      # Release, not debug. The debug variant came out at 123 MB: unstripped
      # native libraries, debug symbols and an unminified bundle.
      #
      # Needs no signing key. The Expo Android template points the release build
      # type at the checked-in debug keystore, so the output is signed with APK
      # Signature Scheme v2 -- enough to sideload. A real key is only needed for
      # Play Store distribution.
      #
      # The retry is for exactly one failure and deliberately refuses to cover
      # anything else. Gradle installs the NDK on demand during this step, and
      # on 6b55d26 that download arrived corrupt:
      #
      #   java.util.zip.ZipException: Archive is not a ZIP archive
      #   "Install NDK (Side by side) 27.1.12297006" failed.
      #
      # on a commit that changed one test file. A red main here is not cosmetic
      # -- this step is what puts an installable APK on the release, so a
      # transient CDN failure means the phone download goes stale until someone
      # notices and retriggers it by hand.
      #
      # So: retry that string, and fail immediately on anything else. A blanket
      # `retry twice` would turn a real, reproducible build failure into twenty
      # minutes of waiting before reporting the same thing, and would quietly
      # paper over a flake that deserved investigating. If a second signature
      # shows up, add it here by name rather than widening the match.
      - name: Build the APK
        working-directory: packages/app/android
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -q 'Archive is not a ZIP archive' build.log; then
              echo "::error::Build failed for a reason a retry will not fix."
              exit 1
            fi
            echo "::warning::Corrupt SDK download on attempt ${attempt}. Clearing it and retrying."
            # Guarded so an unset variable cannot turn this into `rm -rf /ndk`.
            # Best-effort anyway: the retry most likely succeeds because the
            # second download is not corrupt, not because of the clearing.
            for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
              [ -n "$root" ] && rm -rf "$root/ndk"
            done
            true
          done
          echo "::error::The SDK download was corrupt twice running."
          exit 1

      # Ship the single-file web build next to the APK. It is 105 KB against the
      # APK's 55 MB, which matters when the whole point is getting this onto a
      # phone over a link that may not last. Generated here rather than tracked
      # in git, where it silently drifted 209 lines behind the real build.
      - name: Build the standalone single-file version
        run: |
          node packages/proto/build.mjs
          # Name the file what the download should be called. gh's "path#label"
          # syntax sets a display label but leaves the asset -- and its download
          # URL -- named after the file on disk.
          cp packages/proto/dist/tanks-proto.html tanks.html

      # A STABLE filename. Naming it after the commit meant every link went dead
      # the moment anything else was pushed: this workflow recreates the "latest"
      # release each run, which deletes the previous asset. Anyone holding a link
      # got a 404 and reasonably assumed their connection was at fault. The
      # commit is recorded in the release notes instead, where staleness is
      # harmless.
      - name: Collect the APK
        id: apk
        run: |
          SRC=$(find packages/app/android -name '*.apk' | head -1)
          echo "Found APK at $SRC ($(du -h "$SRC" | cut -f1))"
          mkdir -p out
          cp "$SRC" out/tanks.apk
          echo "path=out/tanks.apk" >> "$GITHUB_OUTPUT"
          echo "name=tanks.apk" >> "$GITHUB_OUTPUT"
          unzip -l out/tanks.apk | grep -oE 'lib/[^/]+/' | sort -u | head

      # Prove the APK actually contains what it is supposed to, rather than
      # trusting that a green build implies it.
      #
      # The failure this guards against is silent by construction: Metro only
      # bundles what something imports, so a native module nothing reaches from
      # JavaScript is simply dropped, and the app ships without it while every
      # step here still passes. That is not hypothetical -- it is the state
      # TanksBle is in right now.
      #
      # On encodings, because getting this wrong reports the opposite of the
      # truth: Hermes keeps ASCII strings in a one-byte-per-character table and
      # only uses UTF-16 for strings that need it. So an identifier like
      # `TanksLan` is found by a plain UTF-8 search and NOT by a UTF-16 one,
      # while a UI string with an em dash in it is the other way round.
      # Searching only UTF-16 for a module name returns zero whether or not the
      # module ships. Both encodings, always.
      - name: Check the APK carries the transport, the netcode and the radio
        run: |
          unzip -p out/tanks.apk assets/index.android.bundle > bundle.hbc
          ls -l bundle.hbc

          # Does any JavaScript import the BLE adapter yet?
          #
          # This is what turns the note below into a requirement, without anyone
          # having to remember to promote it. While nothing imports bleAdapter,
          # Metro is right to drop it and its absence is expected. The moment a
          # screen imports it, the bundle must carry it -- and if Metro drops it
          # anyway, `requireNativeModule('TanksBle')` runs at module scope and
          # the app crashes on the import rather than losing Bluetooth quietly.
          #
          # Matched as an import, not a mention: the word appears in a comment in
          # tcpServer.ts, and a comment must not arm a check.
          #
          # Every import form, because this check fails OPEN. An arming pattern
          # that misses is not a missed test -- it silently puts the bundle back
          # in "absence is expected" mode and the APK ships green with no radio,
          # which is the exact failure the whole step exists to catch. The first
          # version matched `from '...'` and `require('...')` only; measured
          # against the alternatives, a double-quoted `from "..."` and a dynamic
          # `import('...')` both left it disarmed. Nothing in this repo enforces
          # quote style -- there is no prettier config and no lint step -- so
          # that was resting on a convention, not a rule.
          #
          # The quotes are what distinguish an import from a mention: the real
          # comment in tcpServer.ts writes it as `bleAdapter.ts` in backticks
          # and does not arm. A comment that quoted a whole module path would
          # arm this wrongly, and that is the direction to err in -- it costs a
          # red build to investigate, not a phone with no Bluetooth.
          #
          # index.ts is the package entry point named in package.json; an
          # import there was outside the old search path entirely.
          if grep -rqE "(from|require|import)[[:space:]]*\(?[[:space:]]*['\"][^'\"]*bleAdapter['\"]" \
               packages/app/src packages/app/App.tsx packages/app/index.ts 2>/dev/null; then
            export BLE_WIRED=1
            echo "JS imports bleAdapter -- the bundle is required to carry it."
          else
            echo "Nothing imports bleAdapter yet -- its absence from the bundle is expected."
          fi

          python3 - <<'PY'
          import os, sys, zipfile
          data = open('bundle.hbc','rb').read()
          ble_wired = os.environ.get('BLE_WIRED') == '1'

          def find(sym):
              return data.count(sym.encode('utf-8')), data.count(sym.encode('utf-16-le'))

          # The native half, which the JS checks below cannot see.
          #
          # These two are autolinked from modules/*/expo-module.config.json, and
          # nothing in JS references TanksBle yet -- so if autolinking broke, no
          # JS check would notice and the APK would ship without the radio. The
          # day the lobby imports bleAdapter, requireNativeModule('TanksBle')
          # runs at module scope: the class being absent is not a degraded
          # Bluetooth experience, it is a crash on the import.
          # Hermes, not plain JavaScript.
          #
          # Nothing in the repo asks for it: android/ is generated and app.json
          # names no jsEngine, so this rides on the Expo template's default. If a
          # template bump ever flipped it, every check below would still pass --
          # plain JS contains the same identifiers -- and the only symptom would
          # be a slower start and more memory on the phone, which nobody would
          # trace back to a build change.
          #
          # The magic is the measured one. Writing it from memory got the last
          # two bytes transposed and reported a real Hermes bundle as plain JS,
          # which is a good illustration of why this reads the artifact.
          if data[:8] != bytes.fromhex('c61fbc03c103191f'):
              print(f"bundle does not start with the Hermes magic: {data[:8].hex(' ')}")
              print("Either the JS engine changed, or Hermes did. Both are worth knowing.")
              sys.exit(1)
          print(f"ok    Hermes bytecode, {len(data):,} bytes\n")

          apk = zipfile.ZipFile('out/tanks.apk')
          dex = b''.join(apk.read(n) for n in apk.namelist()
                         if n.startswith('classes') and n.endswith('.dex'))
          native = {
              'Lexpo/modules/tankslan/TanksLanModule;': 'the WiFi listening socket',
              'Lexpo/modules/tanksble/TanksBleModule;': 'the Bluetooth radio',
          }
          absent = []
          for sig, what in native.items():
              hits = dex.count(sig.encode())
              print(f"{'ok  ' if hits else 'MISSING'}  {sig:<42} dex hits={hits}  ({what})")
              if not hits:
                  absent.append(sig)
          if absent:
              print(f"\n{len(absent)} native module(s) missing from the APK's dex: "
                    f"{', '.join(absent)}")
              print("Autolinking reads modules/*/expo-module.config.json. Check the "
                    "class name there still matches the Kotlin package.")
              sys.exit(1)
          print()

          # Must be reachable from JavaScript or the app cannot host over WiFi
          # and cannot run a match at all.
          required = {
              'TanksLan': 'the native TCP transport, via requireNativeModule',
              'msSinceHostUpdate': "@tanks/core's MatchClient",
              'retireAbandoned': "@tanks/core's MatchHost",
          }
          # Not yet wired up *in JavaScript*. The native classes above are in
          # the APK either way, so "absent" here means Metro dropped the JS
          # binding for want of an importer -- the radio is on board and
          # unreachable, not missing.
          #
          # Promoted to required the moment something imports the adapter, which
          # is decided in the shell above rather than by anyone remembering.
          watched = [] if ble_wired else ['TanksBle', 'bleAdapter']
          if ble_wired:
              required['bleAdapter'] = 'the BLE adapter, now that JS imports it'
              required['TanksBle'] = "the radio's JS binding, via requireNativeModule"

          missing = []
          for sym, what in required.items():
              u8, u16 = find(sym)
              ok = u8 or u16
              print(f"{'ok  ' if ok else 'MISSING'}  {sym:<20} utf8={u8} utf16={u16}  ({what})")
              if not ok:
                  missing.append(sym)

          for sym in watched:
              u8, u16 = find(sym)
              state = 'present' if (u8 or u16) else 'no JS importer yet; native class ships'
              print(f"note      {sym:<20} utf8={u8} utf16={u16}  ({state})")

          # The page itself, which nothing above can see.
          #
          # This is what every other phone in the room is handed. It is not a JS
          # symbol and not a native class, so a build where it went missing or
          # went stale passes every check above and fails as a blank screen on
          # somebody else's handset -- the one player who cannot see the host's
          # console to find out why.
          #
          # Checked as the base64 literal rather than the decoded HTML, and the
          # difference matters. Hermes stores strings in a table with no
          # delimiters, so looking for the decoded page means guessing where the
          # string ends by scanning for a run of plausible characters, and that
          # run does not stop where the string does (see tools/verify-apk.py,
          # which has to do exactly that and documents six bytes of invented
          # spill). The literal is its own delimiter: either the whole 289KB of
          # it is in there or it is not.
          #
          # Two separate facts, and both are worth having:
          #   - embed-page.mjs turned the page that was just built into this
          #     literal, byte for byte;
          #   - Metro carried that literal into the bundle intact.
          import base64, re
          src = open('packages/app/src/net/gamePage.ts').read()
          m = re.search(r"GAME_PAGE_BASE64\s*=\s*'([A-Za-z0-9+/=]+)'", src)
          if not m:
              print("\nno GAME_PAGE_BASE64 literal in src/net/gamePage.ts")
              sys.exit(1)
          b64 = m.group(1)
          built = open('packages/proto/dist/tanks-proto.html', 'rb').read()
          decoded = base64.b64decode(b64)
          if decoded != built:
              print(f"\nembedded page does not match the page just built: "
                    f"{len(decoded):,} bytes embedded, {len(built):,} bytes built")
              print("scripts/embed-page.mjs builds the page first, so this means it "
                    "ran against a different tree than the one being packaged.")
              sys.exit(1)
          # ASCII, so Hermes keeps it one byte per character -- the same reason
          # TanksLan is found by a UTF-8 search and not a UTF-16 one.
          hits = data.count(b64.encode('utf-8'))
          print(f"\n{'ok  ' if hits == 1 else 'MISSING'}  the served page      "
                f"{len(built):,} bytes, {len(b64):,} base64 chars, {hits} copy in the bundle")
          if hits != 1:
              print("The host phone would serve nothing. Metro drops what nothing "
                    "imports: check src/net/gamePage.ts is still reached from the "
                    "host screen.")
              sys.exit(1)

          if missing:
              print(f"\n{len(missing)} required symbol(s) absent from the shipped bundle: "
                    f"{', '.join(missing)}")
              print("Metro drops whatever nothing imports. Check the import chain "
                    "from packages/app/src reaches it.")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tanks-apk
          path: ${{ steps.apk.outputs.path }}

      # A release gives a plain download link a phone browser can follow.
      # Workflow artifacts are zipped and need a logged-in session to fetch,
      # which is a miserable thing to do on a phone.
      - name: Publish to the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            "${{ steps.apk.outputs.path }}" \
            "tanks.html" \
            --title "Latest build" \
            --notes "$(cat <<NOTES
          Built from \`${GITHUB_SHA::7}\`.

          | File | Size | What it is |
          |---|---|---|
          | [\`tanks.apk\`](https://github.com/fso5/tanks-mobile/releases/download/latest/tanks.apk) | $(du -h "${{ steps.apk.outputs.path }}" | cut -f1) | Android app, arm64. Tap to install. |
          | \`tanks.html\` | $(du -h tanks.html | cut -f1) | Single file, opens in any browser. Works offline. |

          Both run with no internet. Tap **2P** for two players on one phone.
          NOTES
          )" \
            --latest
