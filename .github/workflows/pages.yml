# Builds the installable web app and publishes it to GitHub Pages.
#
# This exists so the game can reach a phone with no laptop in the loop: open the
# Pages URL once, install to the home screen, and the service worker keeps it
# working with the network gone.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do not cancel one in flight -- a half
# finished Pages deploy can leave the site serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: enablement: true does not work here. The Actions token can deploy
      # to an existing Pages site but cannot create one -- it comes back with
      # "Resource not accessible by integration". Pages has to be switched on
      # once by hand at Settings > Pages > Source: GitHub Actions. After that
      # this workflow deploys on every push with no further intervention.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # The app imports @tanks/core from dist/, so the core has to be compiled
      # before the page bundle can be built.
      - run: npm run build --workspace @tanks/core

      - name: Run the simulation tests
        run: npm test --workspace @tanks/core

      - name: Build the installable web app
        run: node packages/proto/build-pwa.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/proto/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

        # No retry step here, and no `timeout:` either. Both were tried against
        # this failure and both are recorded because the reasons are specific.
        #
        # `timeout: 1200000` changed nothing -- the step still aborted at 10m05s
        # and 10m06s, the default, measured twice.
        #
        # A second deploy-pages step fired correctly and failed in seven
        # seconds with `Deployment cancelled.`. The log says why: the deployment
        # id *is* the commit sha (`Created deployment for 7c7bbe2..., ID:
        # 7c7bbe2...`). The first attempt cancels that deployment on timeout, so
        # a retry at the same commit re-attaches to one that is already
        # cancelled. Retrying within a run cannot work.

      - name: Explain a failed deploy
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Deploying to GitHub Pages failed."
          echo ""
          echo "  Two things cause this and they are not the same."
          echo ""
          echo "  1. The deployment queued and never came back."
          echo "     The log above says 'Current status: deployment_queued'"
          echo "     over and over, then 'Timeout reached, aborting!'. That is"
          echo "     GitHub being slow, not this repository being wrong. The"
          echo "     site that was already published is still up, so nothing"
          echo "     is broken for anyone."
          echo ""
          echo "     Push a new commit rather than re-running this workflow."
          echo "     The deployment id is the commit sha, and the attempt that"
          echo "     just timed out cancelled it -- a re-run at the same sha"
          echo "     may re-attach to that cancelled deployment and fail in"
          echo "     seconds. A new sha gets a new deployment."
          echo ""
          echo "  2. Pages is not switched on."
          echo "     The log says 'Not Found' or 'Resource not accessible by"
          echo "     integration' instead. The Actions token can deploy to an"
          echo "     existing site but cannot create one, so it has to be"
          echo "     enabled once by hand:"
          echo "       https://github.com/${{ github.repository }}/settings/pages"
          echo "       Source -> GitHub Actions"
          echo ""
          echo "  This route is the only one that gets the game onto an iPhone:"
          echo "  release assets are served as attachments, so Safari downloads"
          echo "  the HTML instead of running it."
          exit 1
