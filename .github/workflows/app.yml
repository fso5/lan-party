# The phone app's own tests, on a pull request rather than after the merge.
#
# ## The gap this fills
#
# Every workflow here filters on paths, and until now none of those filters
# included `packages/app/**` on a pull request:
#
#   web.yml         pull_request, but only for packages/proto and packages/core
#   ios-syntax.yml  pull_request, but only for modules/**/ios/**
#   android.yml     no pull_request trigger at all
#   pages.yml       push to main only
#
# So a branch that touches only the app got no checks whatsoever. Not "a
# reduced set" -- zero. PR #8, the lobby, is 397 lines of `src/net/lobby.ts` and
# has `"total_count": 0, "check_runs": []` against it. The app suite covers the
# native boundary in three directions (module names, events and function
# signatures, none of which the type checker can see), and none of it ran.
#
# The app tests do run today -- inside android.yml's `npm test --workspaces`,
# after the merge, behind an APK build with a thirty-minute cap. That is the
# wrong end: it reports on main, so the first person to learn is whoever pushed
# next, and a native-boundary break sits in the tree in the meantime.
#
# `npm run typecheck` ran nowhere at all, on any branch, at any time.
#
# ## Why this is cheap enough to run on every push too
#
# The suite is 66 vitest tests and takes 1.4 seconds. It needs no browser, no
# Android SDK and no built core -- vitest resolves @tanks/core to its TypeScript
# source through the alias in vitest.config.ts, which is the same thing Metro
# does on a phone. Verified by deleting packages/core/dist and running it: 66
# passed. So this is `npm ci` plus a couple of seconds, and it can be a gate
# where web.yml deliberately is not.
#
# packages/core is in the paths for the same reason: those tests read core's
# source directly, so a core change can turn them red without anything under
# packages/app being touched.
name: App tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous against a measured 1.4s of tests, because the time here is `npm
    # ci` and the page build, not the suite. Short enough that a hang costs
    # minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Both scripts run `embed-page` first, which builds the web page and
      # writes src/net/gamePage.ts -- generated, gitignored, and imported by the
      # net layer, so neither command can run without it.
      #
      # Typecheck before tests, and as its own step, because the suite does not
      # subsume it. Measured rather than assumed: putting
      # `const x: number = 'not a number'` into src/net/tcpServer.ts fails
      # `tsc --noEmit` and passes the tests 66 of 66 -- vitest transpiles
      # through esbuild, which strips the annotation without reading it. Both
      # commands load that file, so this is a real gap and not a suite that
      # never looked.
      - name: Typecheck
        run: npm run typecheck --workspace packages/app

      - name: Test
        run: npm test --workspace packages/app
