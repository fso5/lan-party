<title>Tanks! — physics prototype</title>

<style>
  /* Tabletop diorama. The original reads as toy tanks on a plywood board, and
     that world gives us the palette: warm ply ground, cool slate walls, cork
     blocks, saturated enamel tanks. Neutrals are biased warm toward the ply
     rather than sampled from pure grey. */
  :root {
    color-scheme: light dark;

    --ply:        #E3DCCA;
    --table:      #CFC5AF;
    --ink:        #2A251C;
    --ink-soft:   #6B6252;
    --hairline:   rgba(42, 37, 28, 0.14);
    --panel:      #EDE7D9;

    --stage-bg:   var(--table);
    --ground:     var(--ply);
    --grid:       rgba(90, 78, 58, 0.10);
    --wall:       #55504A;
    --wall-top:   #6E6860;
    --cork:       #B9834A;
    --cork-top:   #CF9A5E;
    --void:       #221E18;
    --shell:      #FFCE6E;
    --aim:        #C1440E;
    --shadow:     rgba(60, 48, 30, 0.20);
    --mine-ring:  rgba(224, 122, 40, 0.55);
    --stick:      rgba(42, 37, 28, 0.30);
    --stick-knob: rgba(42, 37, 28, 0.20);

    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ply:        #26231C;
      --table:      #16140F;
      --ink:        #EDE5D3;
      --ink-soft:   #9A9080;
      --hairline:   rgba(237, 229, 211, 0.14);
      --panel:      #1F1C16;

      --grid:       rgba(255, 240, 210, 0.055);
      --wall:       #3A3630;
      --wall-top:   #4E4840;
      --cork:       #7A5730;
      --cork-top:   #94693A;
      --void:       #0B0A08;
      --shell:      #FFD98F;
      --aim:        #E4753A;
      --shadow:     rgba(0, 0, 0, 0.45);
      --stick:      rgba(237, 229, 211, 0.28);
      --stick-knob: rgba(237, 229, 211, 0.18);
    }
  }

  /* The viewer's own toggle must win over the OS preference, both ways. */
  :root[data-theme="light"] {
    --ply: #E3DCCA; --table: #CFC5AF; --ink: #2A251C; --ink-soft: #6B6252;
    --hairline: rgba(42,37,28,0.14); --panel: #EDE7D9;
    --grid: rgba(90,78,58,0.10); --wall: #55504A; --wall-top: #6E6860;
    --cork: #B9834A; --cork-top: #CF9A5E; --void: #221E18;
    --shell: #FFCE6E; --aim: #C1440E; --shadow: rgba(60,48,30,0.20);
    --stick: rgba(42,37,28,0.30); --stick-knob: rgba(42,37,28,0.20);
  }
  :root[data-theme="dark"] {
    --ply: #26231C; --table: #16140F; --ink: #EDE5D3; --ink-soft: #9A9080;
    --hairline: rgba(237,229,211,0.14); --panel: #1F1C16;
    --grid: rgba(255,240,210,0.055); --wall: #3A3630; --wall-top: #4E4840;
    --cork: #7A5730; --cork-top: #94693A; --void: #0B0A08;
    --shell: #FFD98F; --aim: #E4753A; --shadow: rgba(0,0,0,0.45);
    --stick: rgba(237,229,211,0.28); --stick-knob: rgba(237,229,211,0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--table);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 0.6rem 0.9rem;
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }

  .title {
    font-size: 0.95rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0;
    white-space: nowrap;
  }
  .title span { color: var(--aim); }

  .mapbar { display: flex; align-items: center; gap: 0.4rem; }
  #map-name {
    font-size: 0.82rem;
    font-weight: 550;
    min-width: 8.5ch;
  }
  #map-index {
    font-family: var(--font-num);
    font-size: 0.7rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .stats { display: flex; gap: 1rem; margin-left: auto; }
  .stat { display: flex; flex-direction: column; line-height: 1.15; }
  .stat dt {
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .stat dd {
    margin: 0;
    font-family: var(--font-num);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  button {
    font: inherit;
    font-size: 0.72rem;
    font-weight: 550;
    padding: 0.28rem 0.6rem;
    border-radius: 5px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { background: var(--hairline); }
  button:focus-visible { outline: 2px solid var(--aim); outline-offset: 2px; }
  button[aria-pressed="true"] {
    background: var(--aim);
    border-color: var(--aim);
    color: #FFF6EC;
  }

  #stage {
    flex: 1;
    position: relative;
    min-height: 0;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; }

  #banner {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    opacity: 0;
    transition: opacity 220ms ease;
  }
  #banner[data-show="true"] { opacity: 1; }
  #banner[data-tone="win"]  { color: #4F8A3D; }
  #banner[data-tone="lose"] { color: var(--aim); }
  @media (prefers-reduced-motion: reduce) {
    #banner { transition: none; }
  }

  #debug {
    position: absolute;
    left: 0.6rem;
    bottom: 0.6rem;
    font-family: var(--font-num);
    font-size: 0.68rem;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--hairline);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.9rem;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    font-size: 0.68rem;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  kbd {
    font-family: var(--font-num);
    font-size: 0.66rem;
    border: 1px solid var(--hairline);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0.05rem 0.3rem;
    color: var(--ink);
  }
  .hint { display: flex; align-items: center; gap: 0.3rem; }
  .touch-buttons { display: none; gap: 0.5rem; margin-left: auto; }

  /* Coarse pointer: hide the keyboard legend, show thumb buttons. */
  @media (pointer: coarse) {
    .desktop-only { display: none; }
    .touch-buttons { display: flex; }
    #touch-hint { display: flex !important; }
    footer { font-size: 0.62rem; }
  }
  @media (pointer: fine) {
    .touch-buttons { display: none; }
  }

  /* A phone held sideways is ~390px tall. The arena has to stay legible --
     seeing every bank shot coming is the whole game -- so the chrome gets out
     of the way rather than the board shrinking. */
  @media (max-height: 460px) {
    header { padding: 0.35rem 0.6rem; gap: 0.7rem; }
    .title { font-size: 0.8rem; }
    .stat dt { font-size: 0.5rem; }
    .stat dd { font-size: 0.8rem; }
    .stats { gap: 0.7rem; }
    button { padding: 0.2rem 0.45rem; font-size: 0.66rem; }
    footer { padding: 0.3rem 0.6rem; }
    #debug { bottom: 0.3rem; font-size: 0.6rem; }
  }
</style>

<header>
  <h1 class="title">TANKS<span>!</span></h1>
  <div class="mapbar">
    <button id="btn-prev" aria-label="Previous map">&larr;</button>
    <span id="map-name">—</span>
    <span id="map-index">—</span>
    <button id="btn-next" aria-label="Next map">&rarr;</button>
  </div>
  <button id="btn-restart">Restart</button>
  <button id="btn-traj" aria-pressed="false" title="Trace the shot through the real ricochet physics">Trajectory</button>
  <dl class="stats">
    <div class="stat"><dt>Enemies</dt><dd id="stat-enemies">0</dd></div>
    <div class="stat"><dt>Shells</dt><dd id="stat-shells">0/5</dd></div>
    <div class="stat"><dt>Mines</dt><dd id="stat-mines">0/2</dd></div>
  </dl>
</header>

<div id="stage">
  <canvas id="arena"></canvas>
  <div id="banner" data-show="false"></div>
  <div id="debug" hidden></div>
</div>

<footer>
  <span class="hint desktop-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive</span>
  <span class="hint desktop-only">mouse aims</span>
  <span class="hint desktop-only">click fires</span>
  <span class="hint desktop-only"><kbd>Space</kbd> mine</span>
  <span class="hint desktop-only"><kbd>T</kbd> trajectory</span>
  <span class="hint desktop-only"><kbd>G</kbd> debug</span>
  <span class="hint desktop-only"><kbd>R</kbd> restart</span>
  <span class="hint" style="display:none" id="touch-hint">left thumb drives · right thumb aims and fires</span>
  <div class="touch-buttons">
    <button id="btn-fire">Fire</button>
    <button id="btn-mine">Mine</button>
  </div>
</footer>

<script type="module">
/*__CORE_BUNDLE__*/
/*__GAME__*/
</script>
